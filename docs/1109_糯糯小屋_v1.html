<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="面面">
  <meta name="description" content="面面煎饼铺、六段漫游、找不同、拼图和翻牌，每天收藏一点小欢喜。">
  <link rel="manifest" href="1109_应用信息_v1.webmanifest">
  <link rel="icon" type="image/svg+xml" href="1109_小屋图标_v1.svg">
  <link rel="apple-touch-icon" href="1109_苹果图标_v1.png">
  <link rel="stylesheet" href="1109_界面_v1.css">
  <link rel="stylesheet" href="1109_高难看图_v2.css">
  <link rel="stylesheet" href="1109_耐玩精修_v3.css">
  <link rel="stylesheet" href="1109_煎饼小铺_v4.css">
  <title>面面 · 可爱日常与煎饼小铺</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="#home" aria-label="面面首页"><span id="brand-icon"></span><span>面面<small>收集日常的小欢喜</small></span></a>
      <div class="header-actions"><button id="wallet" class="wallet" data-action="shop" aria-label="星星余额，打开装饰铺"></button><button id="settings" class="icon-button" data-action="settings" aria-label="设置与备份"></button></div>
    </header>
    <main id="content" tabindex="-1"></main>
    <nav id="navigation" class="bottom-nav" aria-label="主导航"></nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-heading"><div><span class="eyebrow" id="sheet-kicker">一点点小美好</span><h2 id="sheet-title"></h2></div><button class="icon-button" data-action="close-sheet" aria-label="关闭弹窗">×</button></div>
    <div id="sheet-content" class="sheet-content"></div>
  </dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript>开启浏览器 JavaScript 后，就能进入面面玩啦。</noscript>
  <script type="module" src="1109_应用_v1.mjs"></script>
</body>
</html>
